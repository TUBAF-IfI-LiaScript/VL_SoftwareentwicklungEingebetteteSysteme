; ---------------------------------------------------------------------------
; Debug-Demo (Variante 2): Debugging von Hand mit OpenOCD + arm-none-eabi-gdb
;
; Board:      ST Nucleo-F401RE (Cortex-M4, on-board ST-LINK/V2-1)
; Framework:  STM32Cube HAL (identischer Code wie in ../Debug_PlatformIO)
;
; Diese Variante nutzt PlatformIO nur zum BAUEN. Das Starten von OpenOCD (als
; GDB-Server) und das Verbinden mit GDB geschieht MANUELL — siehe README.md.
; So wird sichtbar, was PlatformIO in Variante 1 im Hintergrund automatisiert.
; ---------------------------------------------------------------------------

[env:nucleo_f401re]
platform  = ststm32
board     = nucleo_f401re
framework = stm32cube

; Debug-freundlich übersetzen: -Og hält den Code optimiert genug, ohne
; Variablen/Zeilen wegzuoptimieren; -g3 erzeugt volle Debug-Information.
build_flags =
    -Iinc
    -Og
    -g3
