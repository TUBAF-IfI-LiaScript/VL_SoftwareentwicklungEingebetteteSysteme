; ---------------------------------------------------------------------------
; Debug-Übung "Bug Hunt" — Nucleo-F401RE
;
; Drei bewusst eingebaute Fehler, aufsteigend in der Schwierigkeit. Die Aufgabe
; besteht darin, sie MIT DEM DEBUGGER (Breakpoints, Watch, Watchpoints) zu
; finden — nicht durch bloßes Lesen. Siehe exercises/05_Zusammenfassung.md.
;
; Debuggen:  F5 in VS Code (PIO Debug), oder OpenOCD+GDB von Hand
;            (vgl. ../Debug_PlatformIO bzw. ../Debug_OpenOCD_GDB).
; ---------------------------------------------------------------------------

[env:nucleo_f401re]
platform  = ststm32
board     = nucleo_f401re
framework = stm32cube

build_flags = -Iinc

debug_tool        = stlink
upload_protocol   = stlink

; Debug-freundlich: -Og + -g3. Bewusst NICHT -O0, damit die Übung realistisch
; bleibt (so wird später auch released) — Teil des Lerneffekts.
debug_build_flags = -Og -g3
debug_init_break  = tbreak main
