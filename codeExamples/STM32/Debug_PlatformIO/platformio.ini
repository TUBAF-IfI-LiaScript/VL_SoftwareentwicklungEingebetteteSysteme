; ---------------------------------------------------------------------------
; Debug-Demo (Variante 1): Debugging über die integrierte PlatformIO-Oberfläche
;
; Board:      ST Nucleo-F401RE (Cortex-M4, on-board ST-LINK/V2-1)
; Framework:  STM32Cube HAL (schlankes, handgeschriebenes main.c)
;
; Debuggen:   VS Code -> "Run and Debug" -> "PIO Debug"   (Taste F5)
;         oder Kommandozeile:  pio debug --interface=gdb
;
; Der on-board ST-LINK spricht SWD mit dem Ziel. PlatformIO startet OpenOCD
; und arm-none-eabi-gdb im Hintergrund automatisch — genau DAS macht Variante 2
; (Debug_OpenOCD_GDB) von Hand sichtbar.
; ---------------------------------------------------------------------------

[env:nucleo_f401re]
platform  = ststm32
board     = nucleo_f401re
framework = stm32cube

build_flags = -Iinc

; --- Debug-Konfiguration -----------------------------------------------------
; ST-LINK ist der Standard-Debugger dieses Boards; hier zur Klarheit explizit.
debug_tool        = stlink
upload_protocol   = stlink

; -Og + -g3 : Optimierung debug-freundlich halten, volle Debug-Info.
; OHNE das "optimiert" der Compiler Variablen weg, und Breakpoints/Watches
; springen unerwartet — ein klassischer Stolperstein beim Embedded-Debugging.
debug_build_flags = -Og -g3

; Nach dem Laden automatisch bis main() laufen und dort anhalten.
debug_init_break  = tbreak main
